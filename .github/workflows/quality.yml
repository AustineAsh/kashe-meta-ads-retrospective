                      canonical[field] = value
              payload = json.dumps(
                  canonical, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")
              current_hash = sha256(payload).hexdigest()
              if current_hash != expected_hash:
