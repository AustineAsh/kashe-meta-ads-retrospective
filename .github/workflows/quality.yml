name: Reproducibility checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint Python code
        run: ruff check scripts tests
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild and canonicalise public analysis products
        run: python -m scripts.run_pipeline --from-public-csv
      - name: Commit regenerated canonical products
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/meta_campaign_export_sanitized.csv \
            analysis/data_preparation_summary.json \
            analysis/validation_report.json \
            analysis/summary.json \
            analysis/result_type_summary.csv \
            analysis/top_link_click_rows.csv \
            analysis/bunda_named_rows_lower_bound.csv \
            analysis/run_manifest.json \
            assets/
          if ! git diff --cached --quiet; then
            git commit -m "Canonicalise and regenerate verified analysis products"
            git push
          fi
