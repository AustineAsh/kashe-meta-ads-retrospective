name: Reproducibility checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Canonicalise the committed public CSV
        run: python -m scripts.canonicalize_public_csv
      - name: Compare public rows to verified private-source row fingerprints
        run: |
          python - <<'PY'
