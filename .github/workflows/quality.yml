      - name: Commit diagnostic before quality gates
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meta_campaign_export_sanitized.csv analysis/data_preparation_summary.json analysis/public_fingerprint_diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "Compare public records with verified private source"
            git push
          fi
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint Python code
        run: ruff check scripts tests
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild public analysis products
        run: python -m scripts.run_pipeline --from-public-csv
