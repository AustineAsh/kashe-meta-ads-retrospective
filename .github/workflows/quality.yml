name: Reproducibility checks

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint Python code
        run: ruff check scripts tests
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild public analysis products
        run: python -m scripts.run_pipeline --from-public-csv
      - name: Record successful reproducibility run and generated products
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('analysis/ci_success.json').write_text(
              json.dumps({'status': 'pass', 'tested_commit': os.environ['GITHUB_SHA']}, indent=2),
              encoding='utf-8'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/meta_campaign_export_sanitized.csv \
            analysis/data_preparation_summary.json \
            analysis/validation_report.json \
            analysis/summary.json \
            analysis/result_type_summary.csv \
            analysis/top_link_click_rows.csv \
            analysis/bunda_named_rows_lower_bound.csv \
            analysis/run_manifest.json \
            analysis/ci_success.json \
            assets/
          git commit -m "Verify and regenerate reproducible analysis products"
          git push
