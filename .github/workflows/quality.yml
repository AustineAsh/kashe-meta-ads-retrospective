              rows = list(reader)
              fields = list(reader.fieldnames or [])

          mismatches = []
          for row, expected_hash in zip(rows, expected, strict=True):
              canonical = {}
              for field in fields:
                  value = row[field]
                  if field in SEMANTIC_NUMERIC_FIELDS:
                      if value == "":
                          canonical[field] = None
                      else:
                          number = float(value)
                          canonical[field] = int(number) if number.is_integer() else number
